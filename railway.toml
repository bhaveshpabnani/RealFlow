[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m uvicorn src.workflow.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/workflow/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
PYTHONPATH = "/app"