[tool.poetry]
name = "realflow"
version = "0.1.0"
description = "Commercial Real Estate AI Agent using Vapi and Cartesia Sonic 3"
authors = ["bhaveshpabnani <bhaveshpabnani@gmail.com>"]
readme = "README.md"
packages = [
    {include = "src"}
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.0.0"
python-multipart = "^0.0.6"
aiofiles = "^23.2.1"
httpx = "^0.25.2"
google-api-python-client = "^2.108.0"
google-auth-httplib2 = "^0.1.1"
google-auth-oauthlib = "^1.1.0"
gspread = "^5.12.0"
oauth2client = "^4.1.3"
click = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# Unified System (Production)
unified-dev = "src.main:dev"
unified-start = "src.main:start"

# Assistant (original implementation)
assistant-dev = "src.assistant.main:dev"
assistant-start = "src.assistant.main:start"

# Workflow System (new implementation)
workflow-dev = "src.workflow.main:dev"
workflow-start = "src.workflow.main:start"
workflow-cli = "src.workflow.cli:cli"
